[project]
name = "radio-ripper-stream"
version = "2.14.0"
description = "Webradio-Stream-Recorder — dauerhafte parallele Aufzeichnung von ICY-Streams"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Radio-Ripper Contributors" }]
keywords = ["webradio", "streamripper", "icy", "mp3", "recording", "radio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
]
dependencies = [
    "httpx>=0.28.1",
    "mutagen>=1.47.0",
    "pydantic>=2.13.0",
]

[project.scripts]
radio-ripper = "radio_ripper.workflow:main"

[build-system]
requires = ["setuptools>=83.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "RUF", "S"]
ignore = ["S101", "S110", "S112"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002", "SIM105", "SIM115", "S110"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
disallow_untyped_calls = true

[tool.semantic_release]
branch = "main"
tag_format = "v{version}"
version_toml = [
    "pyproject.toml:project.version",
]
version_variables = [
    "src/radio_ripper/__init__.py:__version__",
]
build_command = """
uv lock --upgrade-package "$PACKAGE_NAME"
git add uv.lock
"""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "pre-commit>=4.6.0",
    "python-semantic-release>=10.0.0",
]
