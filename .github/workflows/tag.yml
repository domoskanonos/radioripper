name: radio-ripper-tag

on:
  push:
    paths: ['tag/**', '.github/workflows/tag.yml']
  pull_request:
    paths: ['tag/**']

defaults:
  run:
    working-directory: tag

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run pytest

  docker:
    needs: [test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t radio-ripper-tag tag/
